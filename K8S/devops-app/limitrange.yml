apiVersion: v1
kind: LimitRange
metadata:
  name: devops-app-limits
  namespace: devops-app
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 512Mi
      min:
        cpu: 25m
        memory: 64Mi
      max:
        cpu: 1000m
        memory: 1024Mi