{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "front-chart.fullname" . }}
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:eu-north-1:997206200726:certificate/2520f3a2-6940-45d5-a8bf-ff8529fa8368
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}, {"HTTPS":443}]'
    external-dns.alpha.kubernetes.io/hostname: devops-app.mycloudlab.website
    alb.ingress.kubernetes.io/transforms.{{ .Values.global.backend_host }}: |
      [{
        "type": "url-rewrite",
        "urlRewriteConfig": {
          "rewrites": [
            {
              "regex": "^/api/(.+)$",
              "replace": "/$1"
            }
          ]
        }
      }]
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    - host: {{ .Values.global.hostname }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.global.frontend_host }}
                port:
                  number: 8080
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.global.backend_host }}
                port:
                  number: 5000
{{- end }}